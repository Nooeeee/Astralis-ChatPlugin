name: Astralis-Chatplugin
version: 1.0
main: me.nooeee.Main
author: Nooeee
description: "Le plugin de chat du serveur Astralis [RP]"
api-version: "1.21.1"
softdepend: [PlaceholderAPI]

permissions:
  chatplugin.reload:
    description: Permet d'effectuer la commande reload
    default: false
  annonce.animation:
    description: Permet de faire des annonces pour les scenaristes
    default: op
  annonce.moderateur:
    description: Permet de faire des annonces pour les modérateurs
    default: op
  annonce.scenariste:
    description: Permet de faire des annonces pour les scenaristes
    default: op

commands:
  chatplugin:
    description: Afin de reload le plugin
    permission: chatplugin.reload
    usage: /chatplugin [reload|help]

  annonceanim:
    description: Permet de faire des annonces pour les animations
    usage: /annonceanim <radius> <message>
    permission: annonce.animation
    aliases: ["annonce-anim", "annonce-animation", "annonceanimation"]

  annoncemodo:
    description: Permet de faire des annonces pour la modération
    usage: /annoncemodo <radius> <message>
    permission: annonce.moderateur
    aliases: [ "annonce-modo", "annonce-moderation", "annoncemoderation"]
  annoncescenar:
    description: Permet de faire des annonces pour le scénario
    usage: /annoncescenar <radius> <message>
    permission: annonce.scenariste
    aliases: [ "annonce-scenar", "annonce-scenario", "annoncescenario"]
