name: Astralis-Chatplugin
version: 1.0
main: me.nooeee.Main
author: Nooeee
description: "Le plugin de chat du serveur Astralis [RP]"
api-version: "1.21.1"
softdepend: [PlaceholderAPI, LuckPermsAPI]

permissions:
  # Admin perm
  astralis.*:
    description: "Avoir toutes les permissions du plugin Chat."
    default: false
    children:
      disablechat.*: true
      chatplugin.reload: true
      annonce.*: true

  # Reload Config.yml
  chatplugin.reload:
    description: "[Config] Permet de recharger la configuration du plugin"
    default: false

  # All-Perm Annonce-pole
  annonce.*:
    children:
      annonce.animateur: true
      annonce.moderateur: true
      annonce.scenariste: true
      annonce.broadcast: true
      annonce.narration: true

  # All-perm DisabledChat (Talk & Toggle)
  disablechat.*:
    children:
      disablechat.admin: true
      disablechat.bypass: true

  # ChatStaff
  astralis.staff:
    description: ""
    default: op

  # All Annnonce-pole
  annonce.animateur:
    description: "[RP] Permet de faire des annonces pour les scenaristes"
    default: op
  annonce.moderateur:
    description: "[HRP] Permet de faire des annonces pour les modérateurs"
    default: op
  annonce.scenariste:
    description: "[RP] Permet de faire des annonces pour les scenaristes"
    default: op

  # Global Annonce
  annonce.broadcast:
    description: "[HRP] Permet de faire des broadcast globals"
    default: op
  annonce.narration:
    description: "[RP] Permet de faire des narrations globales"
    default: op

  # All DisableChat
  disablechat.admin:
    description: "[Config] Permet d'activer ou désactiver le chat HRP"
    default: false
  disablechat.bypass:
    description: "[HRP] Permet de bypass le disablechat"
    default: false


commands:
  me:
    description: "[RP] Effectuer une action"
  roll:
    description: "[RP] Faire un nombre entre 0 et 100"

  chatplugin:
    description: "[Config] Reload le plugin de chat"
    permission: chatplugin.reload
    usage: /chatplugin [reload|help]

  disablechat:
    description: "[Config] Activer ou désactiver le chat HRP"
    permission: disablechat.admin
    usage: /disablechat [info]

  staffchat:
    description: "[Staff] Parler dans le StaffChat"
    permission: astralis.staff
    aliases: [sc]

  annonce-animation:
    description: "[RP] Annonce pour les animations"
    usage: /annonceanimation <radius> <message>
    permission: annonce.animation

  annonce-moderation:
    description: "[HRP] Permet de faire des annonces pour la modération"
    usage: /annoncemoderateur <radius> <message>
    permission: annonce.moderateur

  annonce-scenariste:
    description: "[RP] Annonce pour la scénarisation"
    usage: /annoncescenariste <radius> <message>
    permission: annonce.scenariste

  broadcast:
    description: "[HRP] Faire une annonce à la totalité des joueurs connectés"
    usage: /broadcast <message>
    permission: annonce.broadcast

  narration:
    description: "[RP] Faire une narration à la totalité des joueurs connectés"
    usage: /narration <message>
    permission: annonce.narration
