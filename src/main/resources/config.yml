# Message de connexion et de déconnexion (true: activé / false: désactivé)
join-leave: true

# Configuration des paramètres du chat
chat-settings:
  chat-disabled: false

  # Settings du chat HRP
  global:
    radius: 400
    format: "&8[&4HRP&8]&r %prefix% %player% &e>&7 %message%"

  # Settings du chat RP
  roleplay:
    radius: 10
    format: "&9&oAction&r %prefix% %player% &r&9>&7&o %message%"
    anonyme: "&8&oAnonyme : &7&o%message%"

  # Narration et Broadcast
  annonce:
    narration: "[&2Narration&r] : %message%"
    broadcast: "[&cBroadcast&r] : %message%"

  # Formats staffChat
  staff-chat:
    staffChatFormat: "&6[StaffChat] %prefix% %player% &7▶ %message%"
    staffChatPlayerDisabled: "&6[StaffChat] %prefix% %player% &7a &cDésactivé&7 son StaffChat !"
    staffChatPlayerEnabled: "&6[StaffChat] %prefix% %player% &7a &aActivé&7 son StaffChat !"
    staffChatEnabled: "&8 ▶ &6Staff chat &a&lActivé&7 !"
    staffChatDisabled: "&8 ▶ &6Staff chat &c&lDésactivé&7 !"
    enabled-players: []

# Messages erreurs du chat plugin
messages:
  reloaded: "&eConfiguration reload."
  join: "&a♣ &r%player% a rejoint Clover !"
  leave: "&c♣ &r%player% est parti de Clover !"
  statut-format: "&7[&a+&7] &8%player% : &9%status%"
  error:
    args: "&cArguments invalides."
    permission: "&cVous n'avez pas la permission d'effectuer cette commande."

