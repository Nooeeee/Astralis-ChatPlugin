# Configuration des paramètres du chat
chat-settings:
  chat-disabled: false
  # Settings du chat HRP
  global:
    radius: 400
    format: "&8[&4HRP&8]&r %prefix% %player% &e>&7 %message%"
  # Settings du chat RP
  local:
    radius: 10
    format: "&9&oAction&r %prefix% %player% &r&9>&7&o %message%"

  annonce:
    narration: "[&2Narration&r] : %message%"
    broadcast: "[&cBroadcast&r] : %message%"

# Messages du plugin
messages:
  reloaded: "&eConfiguration reload."
  error:
    args: "&cArguments invalides."
    permission: "&cVous n'avez pas la permission d'effectuer cette commande."